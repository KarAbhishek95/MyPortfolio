<svg viewBox="0 0 520 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">
  <rect width="520" height="360" fill="#f7f8fa"/>
  <!-- rocket body wall -->
  <rect x="70" y="40" width="26" height="280" fill="#c9d4e3" stroke="#8a9bb3"/>
  <text x="83" y="335" font-size="11" fill="#5f6b7a" text-anchor="middle">Rocket body</text>
  <!-- ground pivots -->
  <circle cx="96" cy="120" r="6" fill="#111827"/>
  <circle cx="96" cy="230" r="6" fill="#111827"/>
  <text x="60" y="110" font-size="11" fill="#185adb">O2</text>
  <text x="60" y="245" font-size="11" fill="#185adb">O1</text>
  <!-- links (Stephenson III schematic) -->
  <line x1="96" y1="230" x2="330" y2="150" stroke="#185adb" stroke-width="6" stroke-linecap="round"/>
  <line x1="96" y1="120" x2="300" y2="90" stroke="#0f3f9f" stroke-width="6" stroke-linecap="round"/>
  <line x1="330" y1="150" x2="300" y2="90" stroke="#c0392b" stroke-width="6" stroke-linecap="round"/>
  <line x1="330" y1="150" x2="430" y2="120" stroke="#c0392b" stroke-width="6" stroke-linecap="round"/>
  <line x1="300" y1="90" x2="410" y2="60" stroke="#185adb" stroke-width="6" stroke-linecap="round"/>
  <line x1="410" y1="60" x2="430" y2="120" stroke="#0f3f9f" stroke-width="6" stroke-linecap="round"/>
  <!-- joints -->
  <g fill="#fff" stroke="#111827" stroke-width="2">
    <circle cx="330" cy="150" r="6"/><circle cx="300" cy="90" r="6"/>
    <circle cx="430" cy="120" r="6"/><circle cx="410" cy="60" r="6"/>
  </g>
  <!-- coupler / nozzle edge -->
  <path d="M430 120 L470 200 L440 260" fill="none" stroke="#8a2be2" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="452" y="215" font-size="11" fill="#8a2be2">nozzle edge path</text>
  <!-- transmission angle marker -->
  <path d="M330 150 l40 -14 a42 42 0 0 1 -8 26 z" fill="#185adb" opacity="0.18"/>
  <text x="352" y="176" font-size="11" fill="#185adb">&#956; &gt; 30&#176;</text>
  <text x="260" y="30" font-size="13" font-weight="700" fill="#172033">Stephenson III six-bar linkage (schematic)</text>
</svg>
